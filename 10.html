<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>Student Cards PDF Print</title>
  <!-- HTML to PDF converting library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
    }
    .no-print-btn {
      display: block;
      margin: 0 auto 20px auto;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .no-print-btn:hover {
      background-color: #0056b3;
    }
    
    /* A4 Page layout (Grid for 10 cards per page: 2 columns x 5 rows) */
    .pdf-page {
      width: 210mm;
      min-height: 297mm;
      padding: 10mm;
      margin: 0 auto 20px auto;
      background-color: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 8mm;
      page-break-after: always;
    }

    /* Individual Card Box */
    .card {
      border: 2px solid black;
      background-color: white;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      height: 48mm;
    }

    .card-header {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid #ddd;
      padding-bottom: 4px;
      margin-bottom: 4px;
    }

    .card-header img {
      height: 24px;
      max-width: 100%;
      object-fit: contain;
    }

    /* Username (ID) - Bold and Big */
    .username {
      font-size: 15pt;
      font-weight: bold;
      color: #000;
      margin: 2px 0;
      line-height: 1.2;
    }

    /* Student Information */
    .details {
      font-size: 9.5pt;
      color: #222;
      width: 100%;
      line-height: 1.3;
    }

    .details div {
      margin: 2px 0;
    }

    /* Styling during browser print mode */
    @media print {
      body {
        background-color: white;
        padding: 0;
      }
      .no-print-btn {
        display: none;
      }
      .pdf-page {
        box-shadow: none;
        margin: 0;
        width: 100%;
        height: 100vh;
        page-break-after: always;
      }
    }
  </style>
</head>
<body>

  <button class="no-print-btn" onclick="downloadPDF()">Download PDF</button>

  <div id="pdf-container"></div>

  <script>
    // Apnar dynamic JSON data
    const jsonData = {
      "students": [
        { "id": "600119", "name": "Mahdiya Faiza Rahman", "category": "Primary", "room": "801", "floor": "৮ম তলা" },
        { "id": "801769", "name": "Uddipto Biswas", "category": "Primary", "room": "801", "floor": "৮ম তলা" },
        { "id": "802772", "name": "Adib Rahman", "category": "Primary", "room": "801", "floor": "৮ম তলা" },
        // ... apnar bakita ekhane auto kaj korbe
      ]
    };

    // Data grouping & serial wise ordering logic
    function processData(students) {
      const rooms = {};

      // 1. Grouping by Room Number and Category
      students.forEach(student => {
        const r = student.room || 'Unknown';
        const c = student.category || 'Unknown';
        if (!rooms[r]) rooms[r] = {};
        if (!rooms[r][c]) rooms[r][c] = [];
        rooms[r][c].push(student);
      });

      // 2. Sort Room Numbers
      const sortedRoomKeys = Object.keys(rooms).sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));

      const pages = [];

      sortedRoomKeys.forEach(roomKey => {
        const categories = rooms[roomKey];
        const sortedCategoryKeys = Object.keys(categories).sort();

        sortedCategoryKeys.forEach(catKey => {
          let list = categories[catKey];
          
          // 3. Serial wise sorting by Username (ID)
          list.sort((a, b) => a.id.localeCompare(b.id, undefined, {numeric: true}));

          // 4. Split into groups of 10 per page
          for (let i = 0; i < list.length; i += 10) {
            pages.push(list.slice(i, i + 10));
          }
        });
      });

      return pages;
    }

    // Render cards into A4 PDF pages
    function renderPages() {
      const container = document.getElementById('pdf-container');
      const pageGroups = processData(jsonData.students);

      pageGroups.forEach(group => {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'pdf-page';

        group.forEach(student => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-header">
              <img src="/BdJSO Logo.png" alt="BdJSO Logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/150x40?text=BdJSO+Logo';">
            </div>
            <div class="username">${student.id}</div>
            <div class="details">
              <div><strong>Name:</strong> ${student.name}</div>
              <div><strong>Category:</strong> ${student.category}</div>
              <div><strong>Room:</strong> ${student.room} (${student.floor})</div>
            </div>
          `;
          pageDiv.appendChild(card);
        }});

        container.appendChild(pageDiv);
      });
    }

    // Download PDF Trigger Function
    function downloadPDF() {
      const element = document.getElementById('pdf-container');
      const opt = {
        margin:       0,
        filename:     'Student_Cards.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save();
    }

    // Initialize Page Render
    renderPages();
  </script>
</body>
</html>
